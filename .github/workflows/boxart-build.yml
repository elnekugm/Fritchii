name: boxart-build

# Builds the box art fork for Windows and Linux. The Linux AppImage bundles Qt, so it runs on
# Arch/CachyOS and any other distribution with glibc 2.39 or newer.
on:
  workflow_dispatch:
  push:
    branches:
      - boxart-port
      - integration/forks

permissions:
  contents: read

concurrency:
  group: boxart-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x86_64 (MinGW PGO)
    runs-on: windows-2022
    timeout-minutes: 240
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      # MSVC treats several shadowing warnings in this tag as errors (/we4459 and friends) that the
      # GCC/Clang path only reports, so the Windows binary uses MSYS2's clang like the upstream
      # PGO build. It is also the zip that bundles its own libraries.
      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          cache: true
          install: >-
            git make autoconf libtool automake-wrapper patch jq pactoys ninja
          pacboy: >-
            toolchain:p clang:p lld:p cmake:p
            qt6-base:p qt6-charts:p qt6-tools:p qt6-translations:p qt6-svg:p
            openssl:p boost:p fmt:p lz4:p nlohmann-json:p zlib:p zstd:p libiconv:p
            vulkan-memory-allocator:p vulkan-devel:p glslang:p enet:p opus:p
            libusb:p unordered_dense:p jbigkit:p xz:p libdeflate:p bzip2:p
            lerc:p graphite2:p libwebp:p libtiff:p brotli:p ccache:p

      - name: Configure
        shell: msys2 {0}
        run: |
          set -euo pipefail
          profile="-fprofile-use=$(cygpath -m "$PWD/eglantine.profdata") -Wno-backend-plugin \
            -Wno-profile-instr-unprofiled -Wno-profile-instr-out-of-date"
          cmake -S . -B build/release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DYUZU_TESTS=OFF \
            -DYUZU_CMD=OFF \
            -DYUZU_ROOM=OFF \
            -DYUZU_ROOM_STANDALONE=OFF \
            -DYUZU_USE_BUNDLED_QT=OFF \
            -DYUZU_USE_BUNDLED_SDL3=ON \
            -DYUZU_USE_BUNDLED_FFMPEG=ON \
            -DVulkanHeaders_FORCE_BUNDLED=ON \
            -DVulkanUtilityLibraries_FORCE_BUNDLED=ON \
            -DENABLE_UPDATE_CHECKER=OFF \
            -DUSE_DISCORD_PRESENCE=OFF \
            -DENABLE_WERROR=OFF \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=lld \
            "-DCMAKE_C_FLAGS=$profile" \
            "-DCMAKE_CXX_FLAGS=$profile" \
            -DUSE_CCACHE=ON

      - name: Build
        shell: msys2 {0}
        run: |
          ccache --zero-stats
          cmake --build build/release --target yuzu --parallel
          ccache --show-stats

      # A dynamic MinGW build is not portable on its own: windeployqt6 brings the Qt libraries and
      # plugins, then every non-system DLL the binaries and those plugins pull in gets copied next
      # to them (docs/Caveats.md#msys2).
      - name: Package
        shell: msys2 {0}
        run: |
          set -euo pipefail
          export PATH="/ucrt64/bin:$PATH"
          cd build/release/bin
          test -f lichii.exe
          windeployqt6 --no-translations --no-compiler-runtime --no-opengl-sw \
            --no-system-dxc-compiler --no-system-d3d-compiler lichii.exe
          deps() {
            objdump -p "$1" | awk '/DLL Name:/ {print $3}' | while read -r dll; do
              [ -z "$dll" ] && continue
              source=$(command -v "$dll" 2>/dev/null || true)
              [ -z "$source" ] && continue
              case "$source" in
                *System32* | *SysWOW64*) continue ;;
              esac
              if [ ! -f "$dll" ]; then
                cp "$source" "$dll"
                deps "$source"
              fi
            done
          }
          deps lichii.exe
          find . -name '*.dll' | while read -r dll; do
            deps "$dll"
          done

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: banachii-windows-x86_64-pgo
          path: build/release/bin/
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux x86_64 (AppImage)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 3000M
      CCACHE_COMPILERCHECK: content
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf cmake g++ gcc git glslang-tools libglu1-mesa-dev \
            libpulse-dev libtool libudev-dev libxkbcommon-x11-0 \
            mesa-common-dev nasm ninja-build qt6-base-private-dev \
            qt6-charts-dev qt6-tools-dev libavfilter-dev libavcodec-dev \
            libswscale-dev pkg-config zlib1g-dev libva-dev libvdpau-dev \
            spirv-tools spirv-headers libusb-1.0-0-dev \
            libboost-dev libboost-fiber-dev libboost-context-dev \
            libopus-dev libasound2-dev ccache \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtcharts
          cache: true

      - name: Cache compiler objects
        uses: actions/cache@v4
        with:
          path: .ccache
          key: boxart-linux-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            boxart-linux-${{ github.sha }}-
            boxart-linux-

      - name: Configure
        run: |
          cmake -S . -B build/release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DYUZU_TESTS=OFF \
            -DYUZU_CMD=OFF \
            -DYUZU_ROOM=OFF \
            -DYUZU_ROOM_STANDALONE=OFF \
            -DYUZU_USE_BUNDLED_QT=OFF \
            "-DCMAKE_PREFIX_PATH=$QT_ROOT_DIR" \
            -DYUZU_USE_BUNDLED_SDL3=ON \
            -DVulkanHeaders_FORCE_BUNDLED=ON \
            -DVulkanUtilityLibraries_FORCE_BUNDLED=ON \
            -DENABLE_UPDATE_CHECKER=OFF \
            -DUSE_DISCORD_PRESENCE=OFF \
            -DENABLE_WERROR=OFF \
            -DUSE_CCACHE=ON

      - name: Build
        run: |
          ccache --zero-stats
          cmake --build build/release --target yuzu --parallel
          ccache --show-stats

      - name: Package tar.gz
        run: |
          set -euo pipefail
          test -x build/release/bin/lichii
          strip build/release/bin/lichii
          tar -czf banachii-linux-x86_64.tar.gz -C build/release/bin lichii

      - name: Package AppImage
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/linuxdeploy"
          mkdir -p "$tools"
          curl -fsSL -o "$tools/linuxdeploy-x86_64.AppImage" \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -fsSL -o "$tools/linuxdeploy-plugin-qt-x86_64.AppImage" \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x "$tools"/*.AppImage
          icon="$RUNNER_TEMP/io.github.zortos293.lichii.png"
          cp dist/lichii.png "$icon"
          export APPIMAGE_EXTRACT_AND_RUN=1
          export QMAKE="$QT_ROOT_DIR/bin/qmake"
          export EXTRA_QT_MODULES=waylandcompositor
          export EXTRA_PLATFORM_PLUGINS='libqwayland-egl.so;libqwayland-generic.so'
          export LDAI_VERSION="boxart-${GITHUB_SHA::7}"
          export LDAI_OUTPUT="banachii-linux-x86_64.AppImage"
          export OUTPUT="$LDAI_OUTPUT"
          export ARCH=x86_64
          "$tools/linuxdeploy-x86_64.AppImage" --appdir AppDir \
            --executable build/release/bin/lichii \
            --desktop-file dist/io.github.zortos293.lichii.desktop \
            --icon-file "$icon" \
            --plugin qt \
            --output appimage
          test -s "$LDAI_OUTPUT"

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: banachii-linux-x86_64
          path: |
            banachii-linux-x86_64.tar.gz
            banachii-linux-x86_64.AppImage
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
